services:
  api:
    image: ghcr.io/cilpn/agenticaidemobackend:latest
    container_name: agenticdemo-api
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ALLOWED_ORIGIN=https://aidemo.cilpron.com
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agenticdemo-api.rule=Host(`aidemo.cilpron.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.agenticdemo-api.entrypoints=websecure"
      - "traefik.http.routers.agenticdemo-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.agenticdemo-api.priority=1000"
      - "traefik.http.services.agenticdemo-api.loadbalancer.server.port=8787"
      - "traefik.docker.network=traefik-public"

networks:
  traefik-public:
    external: true